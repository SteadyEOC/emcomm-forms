name: Publish
# Publishes to npm when a v* tag is pushed, using npm trusted publishing (OIDC):
# no npm token is stored in GitHub. One-time setup on npmjs.com:
#   emcomm-forms > Settings > Trusted Publisher > GitHub Actions
#   Organization or user: SteadyEOC, Repository: emcomm-forms, Workflow filename: publish.yml
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # needed for trusted publishing and provenance
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: exists
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "emcomm-forms@$v" version >/dev/null 2>&1; then
            echo "emcomm-forms@$v is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip != 'true'
        run: npm ci
      - if: steps.exists.outputs.skip != 'true'
        run: npm run check
      - if: steps.exists.outputs.skip != 'true'
        run: npm publish
